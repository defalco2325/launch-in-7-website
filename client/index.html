<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unregister any old service workers immediately -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    </script>
    
    <!-- Favicon - Multiple formats for browser compatibility -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Content Security Policy for PWA - Relaxed for Calendly integration -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:; frame-src *;">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#123842">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Launchin7">
    <link rel="apple-touch-icon" href="/favicon.svg">
    
    <!-- Critical resource hints for faster loading -->
    <link rel="preconnect" href="https://calendly.com" crossorigin>
    
    <!-- Entry JS will be handled by Vite build process -->
    
    <!-- Using system fonts only - no font preloading to avoid Chrome warnings -->
    
    <!-- SEO and performance meta tags -->
    <meta name="description" content="Launchin7 builds connected business systems: websites, demand, handoffs, bookings, payments, and visibility designed to work together.">
    <meta name="keywords" content="business systems, CRM automation, conversion websites, lead generation, connected operations">
    
    <!-- Open Graph tags for social sharing (iMessage, Facebook, etc.) -->
    <meta property="og:title" content="Launchin7 — Business systems that move growth">
    <meta property="og:description" content="Connected websites, demand, CRM, automation, bookings, payments, and visibility for serious businesses.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:secure_url" content="/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Launchin7 — connected business systems that make growth move">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Launchin7">
    
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Launchin7 — Business systems that move growth">
    <meta name="twitter:description" content="Connected systems for demand, handoffs, bookings, payments, and visibility.">
    <meta name="twitter:image" content="/og-image.png">
    
    <!-- Canonical URL -->
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Launchin7",
      "description": "Connected business systems for serious service and professional businesses",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Launchin7",
      "description": "Connected business systems for serious service and professional businesses",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <title>Launchin7 — Business systems that move growth</title>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="launchin7-clients" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="launchin7-clients" />
      <input type="text" name="businessName" />
      <input type="text" name="website" />
      <input type="text" name="shortDescription" />
      <input type="text" name="biggestChallenge" />
      <input type="text" name="contactName" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="solutionsInterested" />
      <input type="text" name="objectives" />
      <input type="text" name="timeline" />
      <input type="text" name="budget" />
      <input name="bot-field" />
    </form>
    
    <div id="root" role="main"></div>
    
    <!-- Hidden forms for Netlify form detection at build time -->
    <!-- Contact Form -->
    <form name="launchin7-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="launchin7-contact" />
      <p>
        <label>Don't fill this out if you're human: <input name="bot-field" /></label>
      </p>
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="website" />
      <textarea name="message"></textarea>
    </form>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
